<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login</title><style>
body{font-family:Arial;background:#eef3f7;margin:0;display:grid;min-height:100vh;place-items:center}
.card{background:white;padding:28px;border-radius:12px;max-width:380px;width:calc(100% - 48px);box-shadow:0 5px 24px #0001}
h2{color:#174a6e;margin-top:0}label{display:block;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbb;border-radius:6px}
button{margin-top:18px;width:100%;padding:12px;background:#174a6e;color:white;border:0;border-radius:6px;font-weight:bold}
.notice{color:#a00;font-size:13px}.flash{padding:9px;background:#fff0e8;margin:8px 0;border-radius:5px}
small{color:#555}
</style></head><body><main class="card">
<h2>EPHI Record Portal</h2><p><b>Admin Login</b></p>
{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>Username</label><input name="username" autocomplete="username" required>
<label>Password</label><input type="password" name="password" autocomplete="current-password" required>
<button type="submit">Login</button></form>
<p class="notice">Authorized demonstration administrator access only.</p>
<small>Personal record copy — not an official international certificate.</small>
</main></body></html>
