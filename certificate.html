<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate - {{ record.traveler_id }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container card p-4 shadow" style="max-width: 700px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>EPHI Vaccination Certificate</h3>
        <span class="badge bg-{{ 'success' if record.status == 'ACTIVE' else 'danger' }} fs-6">{{ record.status }}</span>
    </div>
    <hr>
    <div class="row">
        <div class="col-8">
            <p><strong>Traveler ID:</strong> {{ record.traveler_id }}</p>
            <p><strong>Full Name:</strong> {{ record.full_name }}</p>
            <p><strong>DOB:</strong> {{ record.dob }} | <strong>Sex:</strong> {{ record.sex }}</p>
            <p><strong>Nationality:</strong> {{ record.nationality }}</p>
        </div>
        <div class="col-4 text-center">
            <img src="data:image/png;base64,{{ qr_code }}" class="img-fluid border p-1" alt="QR Code">
            <small class="d-block mt-1"><a href="{{ verify_url }}" target="_blank">Verification Link</a></small>
        </div>
    </div>
    
    <div class="mt-4">
        <a href="{{ url_for('download_pdf', traveler_id=record.traveler_id) }}" class="btn btn-primary">Download PDF</a>
        <button onclick="window.print()" class="btn btn-secondary">Print Record</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-dark">Back to Dashboard</a>
    </div>
</div>
</body>
</html>
