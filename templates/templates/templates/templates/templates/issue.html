<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Issue Certificate - EPHI</title>
</head>
<body>
    <h1>Issue New Certificate</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label>Recipient Name:</label><br>
        <input type="text" name="recipient" required><br><br>

        <label>Certificate Title:</label><br>
        <input type="text" name="title" required><br><br>

        <label>Organization:</label><br>
        <input type="text" name="organization"
               value="Ethiopian Public Health Institute"><br><br>

        <label>Issue Date:</label><br>
        <input type="date" name="issue_date" required><br><br>

        <label>Expiry Date:</label><br>
        <input type="date" name="expiry_date"><br><br>

        <label>Signatory:</label><br>
        <input type="text" name="signatory"><br><br>

        <label>Certificate Number (optional):</label><br>
        <input type="text" name="cert_no"><br><br>

        <button type="submit">Issue Certificate</button>
    </form>

    <p><a href="/admin">Back to Dashboard</a></p>
</body>
</html>
