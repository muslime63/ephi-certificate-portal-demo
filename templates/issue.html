<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Yellow Fever Certificate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 20px;
        }
        .portal-container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        h2, h3 { text-align: center; }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #167447;
            color: white;
            border: 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="portal-container">
    <h2>EPHI Certificate Portal</h2>
    <h3>Yellow Fever Vaccination Record</h3>

    <form action="/admin/issue" method="POST">
        <div class="form-group">
            <label>Recipient Full Name</label>
            <input type="text" name="recipient" required>
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="dob" required>
        </div>

        <div class="form-group">
            <label>Sex</label>
            <select name="sex" required>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
            </select>
        </div>

        <div class="form-group">
            <label>Vaccine Type</label>
            <input type="text" name="title"
                   value="Yellow Fever Vaccination" readonly>
        </div>

        <div class="form-group">
            <label>Organization / Authorized Vaccination Center</label>
            <input type="text" name="organization" required>
        </div>

        <div class="form-group">
            <label>Date of Vaccination</label>
            <input type="date" name="issue_date" required>
        </div>

        <div class="form-group">
            <label>Authorized Health Professional</label>
            <input type="text" name="signatory" required>
        </div>

        <button type="submit">Save Vaccination Record</button>
    </form>
</div>
</body>
</html>
