<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Issue New Vaccination Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <h2>Issue New Vaccination Record</h2>
        <form method="POST" class="card p-4 shadow-sm">
            <h4>Traveler Information</h4>
            <div class="row mb-3">
                <div class="col-md-6"><label>Full Name</label><input type="text" class="form-control" name="full_name" required></div>
                <div class="col-md-3"><label>Date of Birth</label><input type="text" class="form-control" name="dob" placeholder="YYYY-MM-DD" required></div>
                <div class="col-md-3"><label>Sex</label><select class="form-control" name="sex"><option>Male</option><option>Female</option></select></div>
            </div>
            <div class="mb-3"><label>Nationality</label><input type="text" class="form-control" name="nationality" required></div>

            <hr><h4>Yellow Fever (YF)</h4>
            <div class="row mb-3">
                <div class="col-md-4"><label>Manufacturer</label><input type="text" class="form-control" name="yf_manufacturer"></div>
                <div class="col-md-4"><label>Batch Number</label><input type="text" class="form-control" name="yf_batch"></div>
                <div class="col-md-4"><label>Vaccination Date</label><input type="text" class="form-control" name="yf_date" placeholder="YYYY-MM-DD"></div>
            </div>

            <hr><h4>Oral Polio Vaccine (OPV)</h4>
            <div class="row mb-3">
                <div class="col-md-4"><label>Manufacturer</label><input type="text" class="form-control" name="opv_manufacturer"></div>
                <div class="col-md-4"><label>Batch Number</label><input type="text" class="form-control" name="opv_batch"></div>
                <div class="col-md-4"><label>Vaccination Date</label><input type="text" class="form-control" name="opv_date" placeholder="YYYY-MM-DD"></div>
            </div>

            <hr><h4>Meningococcal A, C, Y, W135</h4>
            <div class="row mb-3">
                <div class="col-md-4"><label>Manufacturer</label><input type="text" class="form-control" name="men_manufacturer"></div>
                <div class="col-md-4"><label>Batch Number</label><input type="text" class="form-control" name="men_batch"></div>
                <div class="col-md-4"><label>Vaccination Date</label><input type="text" class="form-control" name="men_date" placeholder="YYYY-MM-DD"></div>
            </div>

            <hr><h4>Clinician Authorization</h4>
            <div class="row mb-3">
                <div class="col-md-6"><label>Organization / Center</label><input type="text" class="form-control" name="organization"></div>
                <div class="col-md-6"><label>Supervising Clinician</label><input type="text" class="form-control" name="supervising_clinician"></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6"><label>Signature Reference</label><input type="text" class="form-control" name="signature_ref"></div>
                <div class="col-md-6"><label>Authorized By</label><input type="text" class="form-control" name="authorized_by"></div>
            </div>

            <button type="submit" class="btn btn-primary">Generate Certificate & ID</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-2">Back to Dashboard</a>
        </form>
    </div>
</body>
</html>
